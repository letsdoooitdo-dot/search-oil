<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>② 저절로 크롬이 열리는지</title>
<!--
  주유소찾기 - 누르지 않아도 크롬이 열리는가 (2026-09-24, 임시)

  브라우저 표준은 "사용자가 누른 직후"에만 다른 앱을 열게 해준다. 페이지가
  열리자마자 저절로 크롬을 부르는 건 그 규칙에 걸린다 - 광고 페이지가
  앱스토어를 계속 띄우는 악용을 막으려고 만든 규칙이다.
  다만 인앱 브라우저는 앱이 직접 만든 것이라, 앱에 따라 규칙을 안 지키고
  그냥 열어주는 경우가 있다. 그래서 말로 따지지 말고 재본다.

  재는 방법
    들어오자마자(아무것도 안 누르고) 크롬 주소를 부른다.
      성공 -> 크롬이 이 페이지를 ?opened=1 로 다시 연다. 그 화면이 증거다.
      실패 -> 아무 일도 안 일어나고 여기 그대로 있다.
    ★ 되돌림 주소(browser_fallback_url)를 일부러 안 넣었다. 넣으면 크롬이
      없을 때 인앱 브라우저가 그 주소를 그냥 열어버려서, 성공인지 실패인지
      구분이 안 된다.

  버튼으로도 한 번 해볼 수 있게 해뒀다. 버튼은 되는데 자동만 안 되면
  '누름 규칙' 때문이라는 게 확실해진다.

  재고 나면 지운다. noindex 이고 아무 데서도 링크하지 않는다.
-->
<style>
  :root { --ink:#0E1B33; --muted:#6B7C9C; --line:#E6EDF8; --ok:#047857; --no:#E11D48; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px 14px 60px; background:#F7FAFF; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",system-ui,sans-serif;
    word-break:keep-all; -webkit-text-size-adjust:100%; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:19px; margin:0 0 4px; letter-spacing:-.02em; }
  .sub { font-size:12.5px; color:var(--muted); margin:0 0 14px; line-height:1.6; }
  .card { background:#fff; border-radius:14px; padding:14px 15px; margin-bottom:12px;
          box-shadow:0 4px 14px rgba(14,27,51,.07); }
  .card h2 { font-size:13.5px; margin:0 0 9px; letter-spacing:-.02em; }
  button { width:100%; padding:14px; font-size:15px; font-family:inherit; font-weight:700;
           border-radius:11px; border:0; background:var(--ink); color:#fff; cursor:pointer; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:600; }
  button + button { margin-top:8px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:8px 0;
         border-bottom:1px solid #F0F5FC; font-size:12.5px; }
  .row:last-child { border-bottom:0; }
  .row .k { color:var(--muted); flex-shrink:0; }
  .row .v { font-weight:700; text-align:right; word-break:break-all; }
  .y { color:var(--ok); } .n { color:var(--no); }
  .big { font-size:17px; font-weight:800; text-align:center; padding:16px 0; line-height:1.5; }
  .note { background:#FFF6E9; color:#7A5A22; border-radius:12px; padding:12px 14px;
          font-size:12.5px; line-height:1.65; margin-bottom:12px; }
  pre { white-space:pre-wrap; word-break:break-all; font-size:11px; line-height:1.5;
        background:#0E1B33; color:#D8E3F5; padding:12px; border-radius:11px; margin:0; }
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script>
var UA = navigator.userAgent || '';
function appName() {
  if (/Barcelona|Threads/i.test(UA)) return '스레드';
  if (/Instagram/i.test(UA)) return '인스타그램';
  if (/FBAN|FBAV|FB_IAB|FBIOS/i.test(UA)) return '페이스북';
  if (/KAKAOTALK/i.test(UA)) return '카카오톡';
  if (/NAVER\(inapp|NAVER\//i.test(UA)) return '네이버 앱';
  if (/Line\//i.test(UA)) return '라인';
  if (/DaumApps/i.test(UA)) return '다음 앱';
  return '';
}
var IOS = /iPhone|iPad|iPod/i.test(UA);
var AND = /Android/i.test(UA);
var APP = appName();
var OPENED = /[?&]opened=1/.test(location.search);
var HERE = location.href.split('#')[0].split('?')[0];
var TARGET = HERE + '?opened=1';

/* 되돌림 주소를 일부러 뺐다 - 위 주석 참고 */
function androidUrl() {
  return 'intent://' + TARGET.replace(/^https?:\/\//, '') +
    '#Intent;scheme=https;package=com.android.chrome;end';
}
function iosUrl() {
  return TARGET.replace(/^https:/, 'googlechromes:').replace(/^http:/, 'googlechrome:');
}
function chromeUrl() { return AND ? androidUrl() : iosUrl(); }

function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';}
function env() {
  return row('기기', IOS?'아이폰/아이패드':AND?'안드로이드':'컴퓨터/기타') +
         row('앱 안 브라우저', APP ? '<span class="n">'+APP+'</span>'
                                  : '<span class="y">아님 (보통 브라우저)</span>') +
         row('부른 주소', '<span style="font-size:10.5px">'+chromeUrl().slice(0,64)+'…</span>');
}
function dump(result) {
  return ['=== 자동 크롬 열기 실측 ===',
    '시각: ' + new Date().toLocaleString('ko-KR'),
    '기기: ' + (IOS?'아이폰':AND?'안드로이드':'기타') + ' / 앱: ' + (APP||'보통 브라우저'),
    '결과: ' + result,
    'UA: ' + UA].join('\n');
}
function copyBtn(text) {
  setTimeout(function () {
    var b = document.getElementById('copy');
    if (!b) return;
    b.addEventListener('click', function () {
      function done(){ b.textContent='복사됐습니다'; setTimeout(function(){b.textContent='결과 복사';},1500); }
      function fb(){ var ta=document.createElement('textarea'); ta.value=text;
        document.body.appendChild(ta); ta.select();
        try{document.execCommand('copy');done();}catch(e){b.textContent='복사 실패';}
        document.body.removeChild(ta); }
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(text).then(done, fb); else fb();
    });
  }, 0);
}

/* ── 크롬에서 열렸다 = 성공 ─────────────────────────────── */
if (OPENED) {
  var stillApp = !!APP;
  var txt = dump(stillApp
    ? '열리긴 했으나 아직 앱 안 브라우저 (' + APP + ') — 진짜 크롬이 아님'
    : '성공 - 크롬(또는 보통 브라우저)에서 열림');
  document.getElementById('app').innerHTML =
    '<h1>② 저절로 크롬이 열리는지</h1>' +
    '<div class="card"><div class="big ' + (stillApp?'n':'y') + '">' +
      (stillApp ? '△ 넘어오긴 했는데<br>아직 앱 안입니다'
                : '✅ 성공<br>저절로 크롬이 열렸습니다') + '</div>' +
      env() + '</div>' +
    '<div class="card"><button id="copy" class="ghost">결과 복사</button></div>' +
    '<div class="card"><h2>붙여넣을 내용</h2><pre>' + txt + '</pre></div>';
  copyBtn(txt);

/* ── 앱 안이 아니면 잴 게 없다 ──────────────────────────── */
} else if (!APP) {
  document.getElementById('app').innerHTML =
    '<h1>② 저절로 크롬이 열리는지</h1>' +
    '<p class="sub">이 시험은 <b>앱 안 브라우저</b>에서만 뜻이 있습니다.</p>' +
    '<div class="note"><b>스레드나 인스타그램에 이 주소를 올리고, 거기서 눌러 열어주세요.</b><br>' +
      '지금은 보통 브라우저라 아무것도 하지 않았습니다 — 여기서 자동으로 크롬을 열면 ' +
      '그냥 성가시기만 하니까요.</div>' +
    '<div class="card">' + env() + '</div>';

/* ── 앱 안 - 아무것도 안 누르고 바로 시도한다 ──────────────── */
} else {
  document.getElementById('app').innerHTML =
    '<h1>② 저절로 크롬이 열리는지</h1>' +
    '<p class="sub">아무것도 누르지 않았는데 크롬이 열리는지 봅니다.</p>' +
    '<div class="card"><div class="big" id="state">크롬을 부르는 중...</div>' + env() + '</div>' +
    '<div class="card"><h2>버튼으로도 해보기</h2>' +
    '<p class="sub" style="margin:0 0 10px">자동은 안 되는데 버튼은 되면, ' +
      '“누른 직후에만 허용” 규칙 때문이라는 뜻입니다.</p>' +
    '<button id="manual">버튼으로 크롬 열기</button>' +
    '<button id="copy" class="ghost">결과 복사</button></div>' +
    '<div class="card"><h2>붙여넣을 내용</h2><pre id="dumpbox">재는 중...</pre></div>';

  var t0 = Date.now(), left = false, stage = '';
  document.addEventListener('visibilitychange', function () { left = true; });
  window.addEventListener('pagehide', function () { left = true; });

  function gone() { return left || document.visibilityState !== 'visible'; }

  /* ── 1단계: 숨긴 틀(iframe) 안에서 부른다 ──────────────────
     안전한 쪽부터 한다. 최상위에서 바로 intent:// 를 부르면, 앱이 그 주소를
     이해 못 할 때 **오류 페이지로 덮여버려** 사용자가 결과도 못 보고 우리
     페이지도 잃는다. 틀 안에서 부르면 실패해도 이 화면은 그대로 남는다. */
  function tryFrame() {
    stage = '1단계 (숨긴 틀)';
    try {
      var f = document.createElement('iframe');
      f.style.display = 'none';
      f.src = chromeUrl();
      document.body.appendChild(f);
    } catch (e) { }
  }

  /* ── 2단계: 최상위에서 직접 부른다 ────────────────────────
     1단계가 조용하면 이쪽을 해본다. 성공률은 더 높지만, 앱이 주소를 모르면
     오류 페이지가 뜰 수 있다. 그때는 뒤로가기로 돌아오시면 된다. */
  function tryTop() {
    stage = '2단계 (최상위)';
    document.getElementById('state').innerHTML =
      '한 번 더 부르는 중...<br><span style="font-size:12px;font-weight:400;color:#6B7C9C">' +
      '오류 화면이 뜨면 뒤로가기로 돌아와 주세요 — 그것도 결과입니다</span>';
    try { location.href = chromeUrl(); } catch (e) { }
  }

  function verdict(ok, how) {
    document.getElementById('state').innerHTML = ok
      ? '<span class="y">✅ 화면이 넘어갔습니다<br>' + how + '</span>'
      : '<span class="n">❌ 아무 일도 없었습니다<br>자동 전환 안 됨</span>';
    var txt2 = dump(ok
      ? '자동 전환됨 — ' + how + ' (크롬이 실제로 열렸는지 눈으로 확인 필요)'
      : '자동 전환 실패 — 1단계·2단계 모두 아무 일 없음');
    document.getElementById('dumpbox').textContent = txt2;
    copyBtn(txt2);
  }

  tryFrame();
  setTimeout(function () {
    if (gone()) { verdict(true, '1단계(숨긴 틀)에서 성공'); return; }
    tryTop();
    setTimeout(function () {
      /* 화면이 넘어갔다 돌아오면 타이머가 늦게 깬다. 시계로도 걸러낸다. */
      if (gone() || Date.now() - t0 > 6000) { verdict(true, '2단계(최상위)에서 성공'); return; }
      verdict(false, '');
    }, 2500);
  }, 1600);

  document.getElementById('manual').addEventListener('click', function () {
    location.href = chromeUrl();
  });
}
</script>
</body>
</html>
