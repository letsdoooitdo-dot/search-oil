<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>IP 위치 정확도 실측</title>
<!--
  주유소찾기 - IP 위치가 쓸 만한지 재보는 페이지 (2026-09-24)

  묻는 것은 딱 하나다.
    "위치 권한 없이 IP 만으로 알아낸 위치가, GPS 와 같은 시군구로 잡히는가?"

  우리 앱은 좌표를 받아 regions.json 에서 가장 가까운 시군구를 고른다.
  그러니 IP 좌표가 몇 km 틀리든, **같은 시군구로 떨어지면 결과는 똑같다.**
  그래서 'km 오차'보다 '같은 동네로 잡히는가'가 합격 기준이다.

  ★ 이 페이지는 검색에 안 잡히게 막아뒀고(noindex), 아무 데서도 링크하지 않는다.
    다 재고 나면 지운다.
-->
<style>
  :root { --ink:#0E1B33; --muted:#6B7C9C; --line:#E6EDF8; --ok:#047857; --no:#E11D48; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 14px 60px; background: #F7FAFF; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { font-size: 12.5px; color: var(--muted); margin: 0 0 16px; line-height: 1.6; }
  .card {
    background: #fff; border-radius: 14px; padding: 14px 15px; margin-bottom: 12px;
    box-shadow: 0 4px 14px rgba(14,27,51,.07);
  }
  .card h2 { font-size: 13.5px; margin: 0 0 9px; letter-spacing: -.02em; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  select, button {
    width: 100%; padding: 12px; font-size: 15px; font-family: inherit;
    border-radius: 11px; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  button { background: var(--ink); color: #fff; border: 0; font-weight: 700; cursor: pointer; }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 600; }
  button + button { margin-top: 8px; }
  .row {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid #F0F5FC; font-size: 12.5px;
  }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--muted); flex-shrink: 0; }
  .row .v { font-weight: 700; text-align: right; word-break: break-all; }
  .hit { font-size: 11.5px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
  .hit.y { background: #D8F7E9; color: var(--ok); }
  .hit.n { background: #FFE7EC; color: var(--no); }
  .name { font-size: 13.5px; font-weight: 800; margin: 0 0 6px; }
  .note {
    background: #FFF6E9; color: #7A5A22; border-radius: 12px; padding: 12px 14px;
    font-size: 12.5px; line-height: 1.65; margin-bottom: 12px;
  }
  pre {
    white-space: pre-wrap; word-break: break-all; font-size: 11px; line-height: 1.5;
    background: #0E1B33; color: #D8E3F5; padding: 12px; border-radius: 11px; margin: 0;
  }
</style>
</head>
<body>
<div class="wrap">

<h1>IP 위치 정확도 실측</h1>
<p class="sub">위치 권한 없이 알아낸 위치가 GPS와 <b>같은 시군구</b>로 잡히는지 잽니다.
여기서 합격해야 인스타·스레드 안에서도 위치 없이 결과를 낼 수 있습니다.</p>

<div class="note">
  <b>이렇게 재주세요 — 세 번</b><br>
  ① 휴대폰에서 <b>와이파이 끄고</b>(LTE·5G) &nbsp; ② 휴대폰에서 <b>와이파이 켜고</b> &nbsp; ③ 컴퓨터에서<br>
  세 번 다 <b>[결과 복사]</b>를 눌러 저에게 붙여넣어 주세요.
</div>

<div class="card">
  <label for="how">지금 어떤 상태인가요</label>
  <select id="how">
    <option value="휴대폰 LTE·5G (와이파이 끔)">휴대폰 LTE·5G (와이파이 끔)</option>
    <option value="휴대폰 와이파이">휴대폰 와이파이</option>
    <option value="컴퓨터">컴퓨터</option>
    <option value="기타">기타</option>
  </select>
  <div style="height:10px"></div>
  <button id="go">재기 시작 (위치 권한을 한 번 허용해주세요)</button>
  <button id="copy" class="ghost">결과 복사</button>
</div>

<div id="out"></div>

<div class="card">
  <h2>붙여넣을 내용</h2>
  <pre id="dump">아직 재지 않았습니다.</pre>
</div>

</div>

<script>
/* ── 우리 앱과 똑같은 방식으로 시군구를 고른다 ──────────────────
   oil-prefs.js 의 nearest() 와 같은 계산이다. 여기서 다른 방법을 쓰면
   실측 결과가 실제 화면과 어긋난다. */
function distKm(a, b, c, d) {
  var R = 6371, rad = Math.PI / 180;
  var dLat = (c - a) * rad, dLng = (d - b) * rad;
  var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(a * rad) * Math.cos(c * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(s));
}

var REGIONS = null;
function loadRegions() {
  if (REGIONS) return Promise.resolve(REGIONS);
  return fetch('api/regions.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (j) { REGIONS = j.items.filter(function (x) { return x.la != null; }); return REGIONS; });
}
function pickRegion(la, ln) {
  if (!REGIONS || la == null || ln == null) return null;
  var best = null, bd = Infinity;
  for (var i = 0; i < REGIONS.length; i++) {
    var d = distKm(la, ln, REGIONS[i].la, REGIONS[i].ln);
    if (d < bd) { bd = d; best = REGIONS[i]; }
  }
  return best;
}

/* ── 재볼 상대들 ────────────────────────────────────────────
   우리가 쓰려는 건 베르셀이지만, 혹시 베르셀이 형편없으면 갈아탈 수 있게
   키 없이 쓸 수 있는 곳 세 군데를 같이 잰다. */
var SOURCES = [
  { id: 'vercel', name: '베르셀 (우리 서버)',
    url: 'https://search-oil.vercel.app/api/where',
    pick: function (j) { return { la: j.la, ln: j.ln, city: [j.region, j.city].filter(Boolean).join(' '), ip: j.ip }; } },
  { id: 'ipapi', name: 'ipapi.co',
    url: 'https://ipapi.co/json/',
    pick: function (j) { return { la: j.latitude, ln: j.longitude, city: [j.region, j.city].filter(Boolean).join(' '), ip: j.ip }; } },
  { id: 'ipwho', name: 'ipwho.is',
    url: 'https://ipwho.is/',
    pick: function (j) { return { la: j.latitude, ln: j.longitude, city: [j.region, j.city].filter(Boolean).join(' '), ip: j.ip }; } },
  { id: 'geojs', name: 'geojs.io',
    url: 'https://get.geojs.io/v1/ip/geo.json',
    pick: function (j) { return { la: parseFloat(j.latitude), ln: parseFloat(j.longitude), city: [j.region, j.city].filter(Boolean).join(' '), ip: j.ip }; } }
];

var truth = null;      /* GPS - 정답 */
var results = [];
var lines = [];

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
}
function row(k, v) {
  return '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
}

function draw() {
  var html = '';

  html += '<div class="card"><div class="name">📍 GPS (정답)</div>';
  if (!truth) {
    html += row('상태', '<span style="color:#E11D48">못 받음</span>');
  } else {
    var tr = pickRegion(truth.la, truth.ln);
    html += row('좌표', truth.la.toFixed(5) + ', ' + truth.ln.toFixed(5));
    html += row('오차 반경', Math.round(truth.acc) + 'm');
    html += row('우리 앱이 고를 동네', '<b>' + esc(tr ? tr.r : '?') + '</b>');
  }
  html += '</div>';

  results.forEach(function (r) {
    html += '<div class="card"><div class="name">' + esc(r.name) + '</div>';
    if (r.err) {
      html += row('결과', '<span style="color:#E11D48">실패 — ' + esc(r.err) + '</span>');
    } else {
      var reg = pickRegion(r.la, r.ln);
      var same = truth && reg && pickRegion(truth.la, truth.ln) &&
                 reg.r === pickRegion(truth.la, truth.ln).r;
      html += row('말하는 도시', esc(r.city || '-'));
      html += row('좌표', (r.la != null ? r.la.toFixed(5) + ', ' + r.ln.toFixed(5) : '-'));
      html += row('GPS와 거리', truth && r.la != null
        ? '<b>' + distKm(truth.la, truth.ln, r.la, r.ln).toFixed(1) + ' km</b>' : '-');
      html += row('우리 앱이 고를 동네', '<b>' + esc(reg ? reg.r : '?') + '</b>');
      html += row('GPS와 같은 동네?', truth
        ? '<span class="hit ' + (same ? 'y">✅ 같음' : 'n">❌ 다름') + '</span>'
        : '-');
      html += row('걸린 시간', r.ms + 'ms');
    }
    html += '</div>';
  });

  document.getElementById('out').innerHTML = html;
  document.getElementById('dump').textContent = lines.join('\n');
}

function makeDump() {
  var how = document.getElementById('how').value;
  var tr = truth ? pickRegion(truth.la, truth.ln) : null;
  lines = [];
  lines.push('=== IP 위치 실측 ===');
  lines.push('상태: ' + how);
  lines.push('시각: ' + new Date().toLocaleString('ko-KR'));
  lines.push('UA: ' + navigator.userAgent);
  lines.push('');
  lines.push('[GPS 정답] ' + (truth
    ? truth.la.toFixed(5) + ',' + truth.ln.toFixed(5) +
      ' (오차 ' + Math.round(truth.acc) + 'm) -> ' + (tr ? tr.r : '?')
    : '못 받음'));
  lines.push('');
  results.forEach(function (r) {
    if (r.err) { lines.push('[' + r.name + '] 실패: ' + r.err); return; }
    var reg = pickRegion(r.la, r.ln);
    var same = truth && reg && tr && reg.r === tr.r;
    lines.push('[' + r.name + '] ' + (r.city || '-') +
      ' / ' + (r.la != null ? r.la.toFixed(5) + ',' + r.ln.toFixed(5) : '-') +
      ' / GPS와 ' + (truth && r.la != null
        ? distKm(truth.la, truth.ln, r.la, r.ln).toFixed(1) + 'km' : '-') +
      ' / 고를 동네: ' + (reg ? reg.r : '?') +
      ' / ' + (truth ? (same ? '같음 O' : '다름 X') : '-') +
      ' / ' + r.ms + 'ms');
  });
  draw();
}

function getGps() {
  return new Promise(function (ok) {
    if (!navigator.geolocation) { ok(null); return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      ok({ la: p.coords.latitude, ln: p.coords.longitude, acc: p.coords.accuracy });
    }, function () { ok(null); },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}

function ask(src) {
  var t0 = Date.now();
  return fetch(src.url, { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (j) {
      var v = src.pick(j) || {};
      return { name: src.name, la: v.la, ln: v.ln, city: v.city, ip: v.ip,
               ms: Date.now() - t0 };
    })
    .catch(function (e) {
      return { name: src.name, err: String(e.message || e), ms: Date.now() - t0 };
    });
}

document.getElementById('go').addEventListener('click', function () {
  var btn = this;
  btn.disabled = true;
  btn.textContent = '재는 중... (위치 창이 뜨면 허용해주세요)';
  results = [];
  truth = null;
  draw();

  loadRegions()
    .then(function () { return Promise.all([getGps(), Promise.all(SOURCES.map(ask))]); })
    .then(function (a) {
      truth = a[0];
      results = a[1];
      makeDump();
      btn.disabled = false;
      btn.textContent = '다시 재기';
    })
    .catch(function (e) {
      document.getElementById('dump').textContent = '오류: ' + e;
      btn.disabled = false;
      btn.textContent = '다시 재기';
    });
});

document.getElementById('copy').addEventListener('click', function () {
  var t = document.getElementById('dump').textContent;
  var btn = this;
  function done() { btn.textContent = '복사됐습니다'; setTimeout(function () { btn.textContent = '결과 복사'; }, 1500); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done, fallback);
  } else { fallback(); }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { btn.textContent = '복사 실패 - 아래 글을 직접 복사해주세요'; }
    document.body.removeChild(ta);
  }
});
</script>
</body>
</html>
